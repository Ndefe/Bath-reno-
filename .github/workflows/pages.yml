# Deploys the repository root to GitHub Pages on every push to the default branch.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect the public site
        # Published: index.html, about.html, tracker.html, faq-facts.json, catalogue.json,
        # gallery.json, sitemap.xml, robots.txt, sw.js, manifest.webmanifest, favicon.ico,
        # .nojekyll, assets/, suburbs/, and gallery/.
        # Not published: docs/, marketing/, tools/, ROADMAP.md, README.md, and every other repo file.
        # The published pages do not link to those unpublished files.
        run: |
          mkdir -p _site
          cp index.html about.html tracker.html faq-facts.json catalogue.json gallery.json sitemap.xml robots.txt sw.js manifest.webmanifest favicon.ico .nojekyll _site/
          cp -a assets suburbs gallery _site/
          test ! -e _site/docs
          test ! -e _site/ROADMAP.md
          test ! -e _site/tools
          test ! -e _site/marketing
          test ! -e _site/tools/catalogue-source.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
